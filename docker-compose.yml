services:
  mysql:
    image: mysql:8.4
    container_name: al-dalouaa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: al_dalouaa
      MYSQL_USER: dalouaa
      MYSQL_PASSWORD: dalouaa_password
    ports:
      - "3307:3306"
    volumes:
      - al_dalouaa_mysql_data:/var/lib/mysql

volumes:
  al_dalouaa_mysql_data: